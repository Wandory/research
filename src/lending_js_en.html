<script id="D" type="application/json">__DATA__</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('D').textContent);
var N=D.name,S=D.series,A=D.angles,U=D.summary,E=D.econ,C=D.conc,M=D.months;
var order=Object.keys(A).sort(function(a,b){return A[b].A1_tvl_weighted-A[a].A1_tvl_weighted});
var f=function(v,d){return v===null||v===undefined||isNaN(v)?'n/a':(+v).toFixed(d===undefined?2:d)};
var m$=function(v){return (v/1e6).toFixed(v>=1e8?0:1)};
var el=function(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
function table(id,head,rows){var t=document.getElementById(id);if(!t)return;
 t.innerHTML='<thead><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+
 rows.map(function(r){return '<tr>'+r.map(function(c){var cl=(c&&c.cl)?' class="'+c.cl+'"':'';var v=(c&&c.v!==undefined)?c.v:c;
   return '<td'+cl+'>'+v+'</td>'}).join('')+'</tr>'}).join('')+'</tbody>';}

/* fig 1 */
var rank=document.getElementById('rank');
order.forEach(function(p){var o=A[p].A1_tvl_weighted,sub=1-o;
 rank.appendChild(el('div','bline','<span class="cname">'+N[p]+'</span>'+
  '<span class="ctrack"><span class="cfill" style="width:'+(o*100).toFixed(2)+'%"></span>'+
  (sub>0.002?'<span class="cfill dim" style="width:'+(sub*100).toFixed(2)+'%"></span>':'')+'</span>'+
  '<span class="cval">'+f(o)+'</span>'));});

/* fig 2 */
var mult=document.getElementById('mult'),W=200,H=54,SP=2.6;
order.forEach(function(p){var s=S[p],pts=[],seg=[];
 for(var i=0;i<M.length;i++){if(!s[i]||s[i].org===null){if(seg.length){pts.push(seg);seg=[]}continue}
  seg.push([(i/(M.length-1))*W,SP+(1-s[i].org)*(H-2*SP)])}
 if(seg.length)pts.push(seg);
 var area='',line='';
 pts.forEach(function(g){if(g.length<2)return;
  line+='M'+g.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join('L');
  area+='M'+g[0][0].toFixed(1)+','+H+'L'+g.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join('L')+'L'+g[g.length-1][0].toFixed(1)+','+H+'Z'});
 mult.appendChild(el('div','sm','<h4>'+N[p]+'<span>'+f(A[p].A1_tvl_weighted)+'</span></h4>'+
  '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+N[p]+'">'+
  '<line x1="0" y1="'+(H/2)+'" x2="'+W+'" y2="'+(H/2)+'" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 3" opacity=".35"/>'+
  '<path d="'+area+'" fill="currentColor" opacity=".14"/>'+
  '<path d="'+line+'" fill="none" stroke="currentColor" stroke-width="1.3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>'+
  '<p>paid out $'+(U[p].incentives_musd<1?U[p].incentives_musd.toFixed(2):U[p].incentives_musd.toFixed(1))+'M</p>'));});

/* table 1 */
var cols=[['A1_tvl_weighted','A1 TVL'],['A2_equal_weighted','A2 equal'],['A3_median_pool_month','A3 median'],
 ['A4_tvl_over_1m_pools','A4 &gt;$1M'],['A5_pools_18m_plus','A5 18m+'],['A6a_2024','2024'],['A6b_2025','2025'],['A6c_2026','2026'],['spread','spread']];
var RS={'sparklend':1,'venus-core-pool':2,'aave-v3':3,'compound-v3':3,'morpho-blue':2,'fluid-lending':3,'moonwell-lending':2,'euler-v2':6};
table('angles',['Protocol'].concat(cols.map(function(c){return c[1]})).concat(['rank &plusmn;','re run']),
 order.map(function(p){return [N[p]].concat(cols.map(function(c){var v=A[p][c[0]];
   return {v:f(v,c[0]==='spread'?3:2),cl:(c[0]==='spread'?(v>0.4?'neg':''):(v<0.6?'neg':(v>0.985?'mark':'')))};
  })).concat([{v:RS[p],cl:RS[p]>=5?'neg':''},{v:f(D.check[p].run2),cl:D.check[p].diff>0.01?'neg':''}]);}));

/* table 2 + fig 3 */
var mo=order.slice().sort(function(a,b){var x=U[a].inc_dependency,y=U[b].inc_dependency;x=(x===null?99:x);y=(y===null?99:y);return x-y});
table('tmoney',['Protocol','Paid out, $M','Revenue, $M','Dependency','Cost of capital, % a year','Net margin, % a year'],
 mo.map(function(p){var d=U[p];
  return [N[p],m$(d.incentives_musd*1e6),m$(d.revenue_musd*1e6),
   {v:d.inc_dependency===null?'no revenue':f(d.inc_dependency,3),cl:(d.inc_dependency===null||d.inc_dependency>1)?'neg':'mark'},
   f(d.inc_cost_of_capital_pct,3),{v:f(d.net_margin_pct,3),cl:d.net_margin_pct<0?'neg':'mark'}];}));
var nm=document.getElementById('netmargin'),mx=Math.max.apply(null,order.map(function(p){return Math.abs(U[p].net_margin_pct)}));
order.slice().sort(function(a,b){return U[b].net_margin_pct-U[a].net_margin_pct}).forEach(function(p){
 var v=U[p].net_margin_pct,w=Math.abs(v)/mx*50;
 nm.appendChild(el('div','bline','<span class="cname">'+N[p]+'</span>'+
  '<span class="dz"><span class="zl" style="left:50%"></span>'+
  '<span class="'+(v>=0?'':'m')+'" style="left:'+(v>=0?50:50-w)+'%;width:'+w+'%"></span></span>'+
  '<span class="cval">'+f(v,3)+'%</span>'));});

/* table 3 + fig 4 */
var eo=order.slice().sort(function(a,b){return E[b].take_rate-E[a].take_rate});
table('take',['Protocol','Fees, $M','Take rate','To depositors','Borrower rate, % a year','Revenue to supply','Revenue to borrow'],
 eo.map(function(p){var e=E[p];
  return [N[p],m$(e.fees_total),{v:f(e.take_rate)+'%',cl:e.take_rate<1?'neg':'mark'},f(e.passthru,1)+'%',
   f(e.fees_to_borrow),f(e.rev_to_supply,3)+'%',f(e.rev_to_borrow,3)+'%'];}));
(function(){
 var obs=[],i;
 for(i=0;i<M.length;i++){var r=S['compound-v3'][i]; if(r) obs.push({m:M[i],v:r.rev||0});}
 var W=740,H=190,pl=52,pr=14,pt=12,pb=26,mr=Math.max.apply(null,obs.map(function(o){return o.v}));
 var step=(W-pl-pr)/obs.length, bw=Math.min(16,step*0.62);
 var ys=function(v){return pt+(1-v/mr)*(H-pt-pb)};
 var g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="monthly protocol revenue of Compound v3">';
 [0,50000,100000,150000,200000].forEach(function(t){ if(t>mr*1.05) return;
  g+='<line x1="'+pl+'" y1="'+ys(t).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+ys(t).toFixed(1)+'" stroke="currentColor" opacity="'+(t?'.13':'.45')+'"/>'+
     '<text x="'+(pl-8)+'" y="'+(ys(t)+3.5).toFixed(1)+'" text-anchor="end">'+(t?(t/1000)+'k':'0')+'</text>';});
 obs.forEach(function(o,k){ var x=pl+step*k+(step-bw)/2;
  if(o.v>0){ g+='<rect x="'+x.toFixed(1)+'" y="'+ys(o.v).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(ys(0)-ys(o.v)).toFixed(1)+'" fill="var(--ink)"><title>'+o.m+': $'+Math.round(o.v).toLocaleString('en-US')+'</title></rect>'; }
  else { g+='<rect x="'+x.toFixed(1)+'" y="'+(ys(0)-2).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="2" fill="var(--rule-2)"><title>'+o.m+': $0</title></rect>'; }
 });
 [0,Math.floor(obs.length/2),obs.length-1].forEach(function(k){
  g+='<text x="'+(pl+step*k+step/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+obs[k].m+'</text>';});
 var on=-1; for(i=0;i<obs.length;i++){ if(obs[i].v>0){on=i;break;} }
 if(on>=0){ var xo=pl+step*on+step/2;
  g+='<line x1="'+xo.toFixed(1)+'" y1="'+pt+'" x2="'+xo.toFixed(1)+'" y2="'+ys(0).toFixed(1)+'" stroke="currentColor" stroke-dasharray="2 3" opacity=".45"/>'+
     '<text x="'+(xo-6).toFixed(1)+'" y="'+(pt+9)+'" text-anchor="end">revenue switched on</text>';}
 document.getElementById('switch').innerHTML=g+'</svg>';
})();

/* fig 5 + table 4 */
var CR=D.cr.filter(function(r){return r.min_claimed===3}),byP={};
CR.forEach(function(r){(byP[r.project]=byP[r.project]||{})[r.window_days]=r});
var WD=[30,90,180,365],rw=740,rh=230,pad={l:38,r:132,t:12,b:26},lo=0.6,hi=1.08;
var xs=function(i){return pad.l+(i/(WD.length-1))*(rw-pad.l-pad.r)};
var ys=function(v){return pad.t+(1-(v-lo)/(hi-lo))*(rh-pad.t-pad.b)};
var CP=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)','var(--c8)'],labs=[];
var svg='<svg viewBox="0 0 '+rw+' '+rh+'" role="img" aria-label="realised against advertised">';
[0.7,0.8,0.9,1.0].forEach(function(g){
 svg+='<line x1="'+pad.l+'" y1="'+ys(g).toFixed(1)+'" x2="'+(rw-pad.r)+'" y2="'+ys(g).toFixed(1)+'" stroke="currentColor" opacity="'+(g===1?'.5':'.16')+'"'+(g===1?' stroke-dasharray="3 3"':'')+'/>'+
  '<text x="'+(pad.l-7)+'" y="'+(ys(g)+3.4).toFixed(1)+'" text-anchor="end">'+g.toFixed(1)+'</text>';});
WD.forEach(function(w,i){svg+='<text x="'+xs(i).toFixed(1)+'" y="'+(rh-8)+'" text-anchor="middle">'+w+'d</text>';});
order.forEach(function(p,pi){var pts=[];
 WD.forEach(function(w,i){var r=byP[p]&&byP[p][w];if(r)pts.push([xs(i),ys(Math.max(lo,Math.min(hi,r.med_ratio))),r.med_ratio]);});
 if(pts.length<2)return;var col=CP[pi%CP.length];
 svg+='<path d="M'+pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join('L')+'" fill="none" stroke="'+col+'" stroke-width="1.6" stroke-linejoin="round"/>';
 pts.forEach(function(q){svg+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="2.3" fill="'+col+'"/>'});
 var e2=pts[pts.length-1];
 if(e2[0]<xs(WD.length-1)-1){ svg+='<line x1="'+e2[0].toFixed(1)+'" y1="'+e2[1].toFixed(1)+'" x2="'+xs(WD.length-1).toFixed(1)+'" y2="'+e2[1].toFixed(1)+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="2 4" opacity=".55"/>'; }
 labs.push({x:xs(WD.length-1)+8,y:e2[1],t:N[p]+' '+e2[2].toFixed(2)+(e2[0]<xs(WD.length-1)-1?' (180d)':''),col:col});});
labs.sort(function(a,b){return a.y-b.y});
for(var i=1;i<labs.length;i++){if(labs[i].y-labs[i-1].y<12)labs[i].y=labs[i-1].y+12}
var mxY=rh-pad.b-2;for(var i=labs.length-1;i>=0;i--){if(labs[i].y>mxY){labs[i].y=mxY;mxY-=12}}
labs.forEach(function(L){svg+='<text x="'+L.x.toFixed(1)+'" y="'+(L.y+3.4).toFixed(1)+'" fill="'+L.col+'">'+L.t+'</text>'});
document.getElementById('ratio').innerHTML=svg+'</svg>';
table('crt',['Protocol','30 days','90 days','180 days','365 days','Below advertised, 365d','Windows'],
 order.map(function(p){var b=byP[p]||{},r365=b[365];
  return [N[p]].concat(WD.map(function(w){var r=b[w];
   return r?{v:f(r.med_ratio),cl:r.med_ratio<0.85?'neg':(r.med_ratio>=0.99?'mark':'')}:'n/a'}))
   .concat([r365?f(r365.share_below*100,0)+'%':'n/a',Object.keys(b).reduce(function(s,k){return s+b[k].n},0)]);}));

/* table 5 */
table('evt',['Group','Events','Reward before','Reward after','Pool TVL, 90d','Protocol, 90d','Excess, 30d','Excess, 90d','Share negative'],
 D.ev.map(function(r){
  var isTot=r.group.indexOf(' ')<0;
  var nm2=isTot?(r.group==='stop'?'All switch offs':'All switch ons'):((r.group.indexOf('stop')===0?'switch off, ':'switch on, ')+N[r.group.split(' ')[1]]);
  return [{v:isTot?'<b>'+nm2+'</b>':nm2},r.n,f(r.med_reward_before)+'%',f(r.med_reward_after)+'%',
   f(r.med_pool_d90,1)+'%',f(r.med_protocol_d90,1)+'%',
   {v:f(r.med_excess_d30,1)+'%',cl:r.med_excess_d30<-5?'neg':''},
   {v:f(r.med_excess_d90,1)+'%',cl:r.med_excess_d90<-5?'neg':(r.med_excess_d90>20?'mark':'')},
   f(r.share_excess_negative_90d*100,0)+'%'];}));

/* fig 6 */
var UK=[['stable','no movement','var(--rule)'],['mixed','mixed','var(--rule-2)'],['both declining','both declining','var(--ink-3)'],['borrow','borrow driven','var(--ink)'],['supply','supply driven','var(--c4)']];
var us=document.getElementById('ustack');
order.forEach(function(p){var raw=D.utilByP[p]||{},g={stable:0,mixed:0,'both declining':0,borrow:0,supply:0},tot=0;
 Object.keys(raw).forEach(function(k){var n2=raw[k];tot+=n2;
  if(k==='stable')g.stable+=n2;else if(k==='mixed')g.mixed+=n2;else if(k==='both declining')g['both declining']+=n2;
  else if(k.indexOf('borrow')===0)g.borrow+=n2;else g.supply+=n2;});
 var bar=UK.map(function(u){var v=g[u[0]];return v?'<span style="width:'+(v/tot*100).toFixed(2)+'%;background:'+u[2]+'" title="'+u[1]+': '+v+'"></span>':''}).join('');
 us.appendChild(el('div','urow','<span class="cname" style="font-family:var(--sans);font-size:13px">'+N[p]+'</span><span class="ubar">'+bar+'</span>'));});
us.insertAdjacentHTML('afterend','<div class="legend">'+UK.map(function(u){return '<span><i class="sw" style="background:'+u[2]+'"></i>'+u[1]+'</span>'}).join('')+'</div>');

/* table 6 */
var co=order.slice().sort(function(a,b){return C[a].pools_used-C[b].pools_used});
var totInc=order.reduce(function(s,p){return s+U[p].incentives_musd},0);
table('tconc',['Protocol','Pools for 98% of TVL','HHI','Largest pool','Top 5','TVL now, $M','Share of all rewards'],
 co.map(function(p){var c=C[p];
  return [N[p],c.pools_used,f(c.hhi,3),f(c.top1_share*100,0)+'%',f(c.top5_share*100,0)+'%',Math.round(c.total_tvl_now/1e6).toLocaleString('en-US'),
   {v:f(U[p].incentives_musd/totInc*100,1)+'%',cl:U[p].incentives_musd/totInc>0.3?'neg':''}];}));

/* table 7 */
var to=order.slice().sort(function(a,b){return (E[b].holders_share_of_rev||0)-(E[a].holders_share_of_rev||0)});
table('tok',['Protocol','Revenue, $M','To holders, $M','Holders share','First month paid'],
 to.map(function(p){var e=E[p],s=S[p],first=null;
  for(var i=0;i<M.length;i++){if(s[i]&&s[i].hold>0){first=M[i];break}}
  return [N[p],m$(e.rev_total),m$(e.holders_total),
   {v:e.holders_share_of_rev===null?'no revenue':f(e.holders_share_of_rev,1)+'%',cl:e.holders_share_of_rev>60?'mark':''},
   first||'never'];}));

/* files */
var R='https://github.com/Wandory/research/raw/main/data/';
var FL=[['incentives_month.csv','monthly reward rate and subsidy in dollars, per protocol'],
 ['protocol_month.csv','daily supply and borrow aggregated to months'],
 ['fees_month.csv','five revenue series on one matched scope'],
 ['full_month.csv','the merged panel every ratio is computed from'],
 ['claimed_vs_realized.csv','advertised against received yield, four horizons'],
 ['event_study_summary.csv','91 reward switches, net of the protocol trend'],
 ['util_decomposition.csv','monthly utilisation decomposition'],
 ['organic_share_angles.csv','the headline metric under eight angles'],
 ['organic_check.csv','the re collection against the first pass']];
document.getElementById('files').innerHTML=FL.map(function(x){
 return '<a href="'+R+x[0]+'" target="_blank" rel="noopener"><span>'+x[0]+'</span><span>'+x[1]+'</span></a>'}).join('');

/* theme */
document.getElementById('tt').addEventListener('click',function(){
 var c=document.documentElement.getAttribute('data-theme');
 if(!c)c=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
 document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');});
})();
</script>
