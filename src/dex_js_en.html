<script id="D" type="application/json">__DATA__</script>
<script>
(function(){
var D=JSON.parse(document.getElementById('D').textContent);
var N={'uniswap-v3':'Uniswap v3','uniswap-v4':'Uniswap v4','curve-dex':'Curve','aerodrome-slipstream':'Aerodrome Slipstream','aerodrome-v1':'Aerodrome v1','balancer-v3':'Balancer v3'};
var num=function(v){return parseFloat(v)||0};
var el=function(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};
var m$=function(v){return v>=1e9?(v/1e9).toFixed(2)+'B':(v/1e6).toFixed(v>=1e8?0:1)+'M'};
function table(id,head,rows){var t=document.getElementById(id);if(!t)return;
 t.innerHTML='<thead><tr>'+head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>'+
 rows.map(function(r){return '<tr>'+r.map(function(c){var cl=(c&&c.cl)?' class="'+c.cl+'"':'';var v=(c&&c.v!==undefined)?c.v:c;
  return '<td'+cl+'>'+v+'</td>'}).join('')+'</tr>'}).join('')+'</tbody>';}
var DEX=D.totals.filter(function(t){return t.grp==='dex'}).sort(function(a,b){return num(b.organic)-num(a.organic)});

var rank=document.getElementById('orgBars');
DEX.forEach(function(t){var o=num(t.organic),sub=1-o;
 rank.appendChild(el('div','bline','<span class="cname">'+(N[t.project]||t.project)+'</span>'+
 '<span class="ctrack"><span class="cfill" style="width:'+(o*100).toFixed(2)+'%"></span>'+
 (sub>0.002?'<span class="cfill dim" style="width:'+(sub*100).toFixed(2)+'%"></span>':'')+'</span>'+
 '<span class="cval">'+o.toFixed(2)+'</span>'));});

var mult=document.getElementById('mult'),W=200,H=54,SP=2.6,M=D.months;
DEX.forEach(function(t){var s=D.series[t.project].org,pts=[],seg=[];
 for(var i=0;i<M.length;i++){if(s[i]===null){if(seg.length){pts.push(seg);seg=[]}continue}
  seg.push([(i/(M.length-1))*W,SP+(1-s[i])*(H-2*SP)])}
 if(seg.length)pts.push(seg);
 var area='',line='';
 pts.forEach(function(g){if(g.length<2)return;
  line+='M'+g.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join('L');
  area+='M'+g[0][0].toFixed(1)+','+H+'L'+g.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join('L')+'L'+g[g.length-1][0].toFixed(1)+','+H+'Z'});
 mult.appendChild(el('div','sm','<h4>'+(N[t.project]||t.project)+'<span>'+num(t.organic).toFixed(2)+'</span></h4>'+
  '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+t.project+'">'+
  '<line x1="0" y1="'+(H/2)+'" x2="'+W+'" y2="'+(H/2)+'" stroke="currentColor" stroke-width="0.7" stroke-dasharray="2 3" opacity=".35"/>'+
  '<path d="'+area+'" fill="currentColor" opacity=".14"/>'+
  '<path d="'+line+'" fill="none" stroke="currentColor" stroke-width="1.3" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>'+
  '<p>$'+(num(t.incentives_usd)/1e6).toFixed(1)+'M paid out</p>'));});

var rows=D.ev.map(function(e){
 var pr=e.group.split('|')[1], ty=e.group.split('|')[0];
 var isTot=(pr==='all');
 var nm=isTot?(ty==='stop'?'All switch-offs':'All switch-ons'):((ty==='stop'?'switch-off, ':'switch-on, ')+(N[pr]||pr));
 return [{v:isTot?'<b>'+nm+'</b>':nm},e.n,num(e.med_reward_before).toFixed(2)+'%',num(e.med_reward_after).toFixed(2)+'%',
  num(e.med_pool_d90).toFixed(1)+'%',num(e.med_protocol_d90).toFixed(1)+'%',
  {v:num(e.med_excess_d30).toFixed(1)+'%',cl:num(e.med_excess_d30)<-5?'neg':(num(e.med_excess_d30)>15?'mark':'')},
  {v:num(e.med_excess_d90).toFixed(1)+'%',cl:num(e.med_excess_d90)<-5?'neg':(num(e.med_excess_d90)>15?'mark':'')},
  (num(e.share_excess_neg_90)*100).toFixed(0)+'%'];});
rows.push([{v:'<b>Lending, switch-ons</b>'},50,'0.00%','1.09%','19.5%','6.6%','5.8%','-0.6%','52%']);
rows.push([{v:'<b>Lending, switch-offs</b>'},41,'1.89%','0.41%','-12.5%','1.1%',{v:'-6.0%',cl:'neg'},{v:'-7.4%',cl:'neg'},'56%']);
table('evTable',['Group','Events','Reward before','Reward after','Pool TVL, 90d','Venue, 90d','Excess, 30d','Excess, 90d','Share negative'],rows);

table('incTable',['Venue','Pools','TVL now','Paid out','Fee rate','Reward rate','Fee share','Price of liquidity, %/yr'],
 DEX.slice().sort(function(a,b){return num(b.incentives_usd)-num(a.incentives_usd)}).map(function(t){
  var s=D.series[t.project],tv=s.tvl.filter(function(x){return x!==null}),inc=num(t.incentives_usd);
  var avg=tv.reduce(function(a,b){return a+b},0)/(tv.length||1), months=tv.length;
  var price=months?inc/avg*(12/months)*100:0;
  return [(N[t.project]||t.project),t.pools,'$'+m$(num(t.tvl_now)),
   {v:'$'+m$(inc),cl:inc>2e7?'neg':''},num(t.base_apy_w).toFixed(2)+'%',
   {v:num(t.reward_apy_w).toFixed(2)+'%',cl:num(t.reward_apy_w)>5?'neg':''},
   num(t.organic).toFixed(2),price.toFixed(1)+'%'];}));

var R='https://github.com/Wandory/research/raw/main/data/';
document.getElementById('files').innerHTML=[['dex_stable_monthly.csv','monthly panel by venue and issuer'],
 ['dex_stable_totals.csv','venue totals: pools, TVL, emissions, rate composition'],
 ['dex_events_did.csv','60 emissions changes, adjusted for the venue trend']]
 .map(function(x){return '<a href="'+R+x[0]+'" target="_blank" rel="noopener"><span>'+x[0]+'</span><span>'+x[1]+'</span></a>'}).join('');

document.getElementById('tt').addEventListener('click',function(){
 var c=document.documentElement.getAttribute('data-theme');
 if(!c)c=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
 document.documentElement.setAttribute('data-theme',c==='dark'?'light':'dark');});
})();
</script>
