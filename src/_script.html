<script>
(function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.documentElement.classList.add('js');

  /* reveal */
  var items = [].slice.call(document.querySelectorAll('.r'));
  function showAll(){ items.forEach(function(el){ el.classList.add('on'); }); }
  if(reduce || !('IntersectionObserver' in window)) showAll();
  else{
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -6% 0px', threshold:.06});
    items.forEach(function(el){ io.observe(el); });
    setTimeout(showAll, 2400);
  }

  /* static grain, drawn once */
  (function(){
    var n=180, c=document.createElement('canvas'); c.width=n; c.height=n;
    var x=c.getContext('2d'), d=x.createImageData(n,n), a=d.data;
    for(var i=0;i<a.length;i+=4){
      var v=(Math.random()*255)|0;
      a[i]=a[i+1]=a[i+2]=v; a[i+3]=Math.random()*255;
    }
    x.putImageData(d,0,0);
    document.getElementById('grain').style.backgroundImage='url('+c.toDataURL()+')';
  })();

  /* slow drifting dust */
  (function(){
    if(reduce) return;
    var cv=document.getElementById('dust'), ctx=cv.getContext('2d');
    var W=0,H=0,dpr=1,P=[];
    var col='#FFFFFF';
    window.__dustColor=function(){};
    function hexA(hex,a){
      hex=String(hex).replace('#','');
      if(hex.length===3) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      var v=parseInt(hex.slice(0,6),16); if(isNaN(v)) v=0xEFEFED;
      return 'rgba('+((v>>16)&255)+','+((v>>8)&255)+','+(v&255)+','+a+')';
    }
    function resize(){
      dpr=Math.min(window.devicePixelRatio||1,2);
      W=window.innerWidth; H=window.innerHeight;
      cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
      var count=Math.round(Math.min(70, Math.max(26, W*H/26000)));
      P=[];
      for(var i=0;i<count;i++) P.push({
        x:Math.random()*W, y:Math.random()*H,
        r:0.5+Math.random()*1.3, sp:0.06+Math.random()*0.16,
        ph:Math.random()*Math.PI*2, am:6+Math.random()*16,
        a:0.05+Math.random()*0.14
      });
    }
    resize(); window.addEventListener('resize',resize);
    var sy=0;
    window.addEventListener('scroll',function(){ sy=window.scrollY; },{passive:true});
    (function loop(t){
      ctx.clearRect(0,0,W,H);
      for(var i=0;i<P.length;i++){
        var q=P[i];
        q.y+=q.sp;
        if(q.y>H+8){ q.y=-8; q.x=Math.random()*W; }
        var px=q.x+Math.sin(t*0.00016+q.ph)*q.am;
        var py=q.y-(sy*0.05)%(H+16);
        if(py<-8) py+=H+16;
        ctx.beginPath(); ctx.arc(px,py,q.r,0,6.2832);
        ctx.fillStyle=hexA(col,q.a); ctx.fill();
      }
      requestAnimationFrame(loop);
    })(0);
  })();

  /* number count-up, once */
  (function(){
    var fmt=new Intl.NumberFormat('en-US');
    var els=[].slice.call(document.querySelectorAll('.num b'));
    els.forEach(function(el){
      var raw=el.textContent.trim();
      var m=raw.match(/^([^0-9]*)([0-9][0-9,\s]*)(.*)$/);
      if(!m) return;
      var target=parseInt(m[2].replace(/[^0-9]/g,''),10);
      if(!isFinite(target)) return;
      el.dataset.pre=m[1]; el.dataset.post=m[3]; el.dataset.to=target;
    });
    function run(el){
      var to=+el.dataset.to, pre=el.dataset.pre||'', post=el.dataset.post||'', t0=null, dur=900;
      function step(t){
        if(!t0) t0=t;
        var k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
        el.textContent=pre+fmt.format(Math.round(to*e))+post;
        if(k<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
    var targets=els.filter(function(el){ return el.dataset.to; });
    if(reduce || !('IntersectionObserver' in window)) return;
    var io2=new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ run(e.target); io2.unobserve(e.target); } });
    },{threshold:.4});
    targets.forEach(function(el){ io2.observe(el); });
  })();

  /* scroll position, printed as instrumentation */
  (function(){
    var out=document.getElementById('scrollpos');
    var ss=[].slice.call(document.querySelectorAll('main section.sec'));
    var total=ss.length, tick=false;
    function upd(){
      var h=document.documentElement.scrollHeight-window.innerHeight;
      var pct=h>0?Math.round(Math.min(100,Math.max(0,window.scrollY/h*100))):0;
      var idx=1, mid=window.scrollY+window.innerHeight*0.35;
      for(var i=0;i<total;i++){ if(ss[i].offsetTop<=mid) idx=i+1; }
      out.textContent=String(idx).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'  \u00b7  '+pct+'%';
      tick=false;
    }
    window.addEventListener('scroll',function(){ if(!tick){ tick=true; requestAnimationFrame(upd); } },{passive:true});
    window.addEventListener('resize',upd); upd();
  })();

  /* scroll spy */
  var links = [].slice.call(document.querySelectorAll('nav.jump a'));
  var secs = links.map(function(a){ return document.querySelector(a.getAttribute('href')); }).filter(Boolean);
  if('IntersectionObserver' in window && secs.length){
    var spy = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){
          links.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href') === '#'+e.target.id); });
        }
      });
    }, {rootMargin:'-30% 0px -60% 0px', threshold:0});
    secs.forEach(function(s){ spy.observe(s); });
  }

  /* theme */
  var root = document.documentElement, tbtn = document.getElementById('theme');
  function curTheme(){
    var a = root.getAttribute('data-theme');
    if(a) return a;
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
  }
  try{ var st = localStorage.getItem('cv-theme'); if(st) root.setAttribute('data-theme', st); }catch(e){}
  tbtn.addEventListener('click', function(){
    var next = curTheme()==='dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('cv-theme', next); }catch(e){}
    if(window.__dustColor) window.__dustColor();
  });

  /* copy */
  [].forEach.call(document.querySelectorAll('.copybtn'), function(b){
    var label = b.querySelector('span');
    b.addEventListener('click', function(){
      var v = b.dataset.copy, done = function(){
        b.classList.add('done'); label.textContent = 'Copied';
        setTimeout(function(){
          b.classList.remove('done');
          label.textContent = 'Copy';
        }, 1600);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(v).then(done, done); }
      else{
        var ta=document.createElement('textarea'); ta.value=v; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); }catch(e){}
        document.body.removeChild(ta); done();
      }
    });
  });
})();
</script>
